var KEY="plantao30d_v1";
var dados={};
var exp={};
var filtro="todos";

function load(){try{var v=localStorage.getItem(KEY);if(v)dados=JSON.parse(v);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(dados));}catch(e){}}
function dk(day,si,fid){return day+"-"+si+"-"+fid;}
function feito(day){
  var d=DIAS.find(function(x){return x.day===day;});
  if(!d)return 0;
  return d.sub.reduce(function(a,_,si){return a+FASES.filter(function(f){return dados[dk(day,si,f.id)];}).length;},0);
}
function pct(day){var t=DIAS.find(function(x){return x.day===day;});if(!t)return 0;var tot=t.sub.length*3;return tot?Math.round(feito(day)/tot*100):0;}
function cor(p){if(p===100)return"#22c55e";if(p>=60)return"#f97316";if(p>0)return"#6366f1";return"#1e2535";}

function hero(){
  var ta=DIAS.reduce(function(a,d){return a+d.sub.length*3;},0);
  var ok=DIAS.reduce(function(a,d){return a+feito(d.day);},0);
  var p=Math.round(ok/ta*100);
  var dc=DIAS.filter(function(d){return pct(d.day)===100;}).length;
  document.getElementById("pct-num").textContent=p+"%";
  document.getElementById("bar-geral").style.width=p+"%";
  document.getElementById("stat-dias").textContent=dc;
  document.getElementById("stat-ok").textContent=ok;
  document.getElementById("stat-tot").textContent=ta;
  var wg=document.getElementById("weeks-grid");
  wg.innerHTML="";
  SEMANAS.forEach(function(s){
    var ds=DIAS.filter(function(d){return d.sem===s.num;});
    var o=ds.reduce(function(a,d){return a+feito(d.day);},0);
    var t=ds.reduce(function(a,d){return a+d.sub.length*3;},0);
    var pp=Math.round(o/t*100);
    var cc=ds.filter(function(d){return pct(d.day)===100;}).length;
    var el=document.createElement("div");
    el.className="week-card";
    el.style.border="1px solid "+s.cor+"25";
    el.innerHTML='<div class="week-label" style="color:'+s.cor+'">'+s.label+" — "+s.sub+'</div><div class="week-bar"><div class="week-fill" style="width:'+pp+'%;background:'+s.cor+'"></div></div><div class="week-stats">'+pp+"% · "+cc+"/"+ds.length+" dias</div>";
    wg.appendChild(el);
  });
}

function lista(){
  var el=document.getElementById("lista");
  el.innerHTML="";
  SEMANAS.forEach(function(s){
    var ds=DIAS.filter(function(d){
      if(d.sem!==s.num)return false;
      var p=pct(d.day);
      if(filtro==="pendentes")return p<100;
      if(filtro==="progresso")return p>0&&p<100;
      if(filtro==="concluidos")return p===100;
      return true;
    });
    if(!ds.length)return;
    var ti=document.createElement("div");
    ti.className="sem-title";ti.style.color=s.cor;
    ti.textContent=s.label+" — "+s.sub;
    el.appendChild(ti);
    ds.forEach(function(d){el.appendChild(card(d));});
  });
}

function card(d){
  var p=pct(d.day);var done=p===100;var open=!!exp[d.day];var c=cor(p);
  var el=document.createElement("div");
  el.className="day-card"+(done?" done":"");
  var hd=document.createElement("div");hd.className="day-head";
  hd.innerHTML='<div class="day-num'+(done?" done":"")+'">'+d.day+'</div><div class="day-info"><div class="day-tema'+(done?" done":"")+'">'+d.tema+'</div><div class="day-bar-row"><div class="day-bar-track"><div class="day-bar-fill" style="width:'+p+'%;background:'+c+'"></div></div><span class="day-pct" style="color:'+c+'">'+p+'%</span></div></div><span class="chevron">'+(open?"▲":"▼")+'</span>';
  hd.addEventListener("click",function(){exp[d.day]=!exp[d.day];lista();});
  el.appendChild(hd);
  if(open){
    var sa=document.createElement("div");sa.className="sub-area";
    d.sub.forEach(function(sub,si){
      var cnt=FASES.filter(function(f){return dados[dk(d.day,si,f.id)];}).length;
      var sd=cnt===3;
      var it=document.createElement("div");it.className="sub-item";
      var tx=document.createElement("div");tx.className="sub-text"+(sd?" done":"");tx.textContent=(si+1)+". "+sub;
      it.appendChild(tx);
      var fr=document.createElement("div");fr.className="fase-row";
      FASES.forEach(function(f){
        var ok=!!dados[dk(d.day,si,f.id)];
        var bt=document.createElement("button");bt.className="fase-btn";
        bt.style.border="1px solid "+(ok?f.cor:"#1e293b");
        bt.style.color=ok?f.cor:"#334155";
        bt.style.background=ok?f.cor+"20":"transparent";
        bt.textContent=f.icon+(ok?" ✓ ":" ")+f.label;
        bt.addEventListener("click",function(e){
          e.stopPropagation();
          dados[dk(d.day,si,f.id)]=!dados[dk(d.day,si,f.id)];
          save();hero();lista();
        });
        fr.appendChild(bt);
      });
      it.appendChild(fr);sa.appendChild(it);
    });
    el.appendChild(sa);
  }
  return el;
}

document.getElementById("filters").addEventListener("click",function(e){
  var b=e.target.closest(".filter-btn");if(!b)return;
  filtro=b.dataset.f;
  document.querySelectorAll(".filter-btn").forEach(function(x){x.classList.remove("active");});
  b.classList.add("active");lista();
});

load();hero();lista();
</script>
</body>
</html>
